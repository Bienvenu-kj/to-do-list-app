<main id="conteneur" class="header h-full">
  <div class="h-full">
    <header id="header" class="header sticky top-0">
      <div class="barre-recherche flex items-center gap-x-4">
        <div role="button" class="retourner" (click)="closeSearch()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
            data-slot="icon"
          >
            <path
              fill-rule="evenodd"
              d="M11.03 3.97a.75.75 0 0 1 0 1.06l-6.22 6.22H21a.75.75 0 0 1 0 1.5H4.81l6.22 6.22a.75.75 0 1 1-1.06 1.06l-7.5-7.5a.75.75 0 0 1 0-1.06l7.5-7.5a.75.75 0 0 1 1.06 0Z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <div class="researchContainer relative flex flex-1 items-center">
          <div class="absolute left-3">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="rgba(156, 163, 175,1)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-search"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
          </div>
          <input
            id="searchInput"
            (input)="searchTasks($event)"
            class="placeholder:text-gray-400 focus:border p-2 rounded-2xl bg-gray-100 w-full pl-10"
            type="search"
            placeholder="Rechercher des taches"
          />
        </div>
      </div>
      @if (isSearching()) {
        <div class="mt-4">
          <div class="tache-ttr text-blue-600 text-center">
            {{ matchingTaskCount() }}
            {{ matchingTaskCount() === 1 ? "résultat" : "résultats" }}
          </div>
        </div>
      }
    </header>
    @if (isSearching()) {
      <app-task-list />
    }
  </div>
</main>
