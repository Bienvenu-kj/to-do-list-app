<main id="conteneur" class="startResearch header">
  <div class="bordure-t-l-r">
    <header id="header" class="pos-stck header">
      <div class="barre-recherche">
        <div role="button" class="retourner" (click)="onVeutPlusChercher()" >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
            data-slot="icon"
          >
            <path
              fill-rule="evenodd"
              d="M11.03 3.97a.75.75 0 0 1 0 1.06l-6.22 6.22H21a.75.75 0 0 1 0 1.5H4.81l6.22 6.22a.75.75 0 1 1-1.06 1.06l-7.5-7.5a.75.75 0 0 1 0-1.06l7.5-7.5a.75.75 0 0 1 1.06 0Z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <div class="researchContainer relative flex items-center">
          <div class="absolute left-3">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="rgba(156, 163, 175,1)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-search"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
          </div>
          <input
            id="researchInput"
            (input)="RecherTaches($event)"
            class="speeking border p-2 rounded-2xl bg-gray-100 w-full pl-10"
            type="search"
            placeholder="Rechercher des taches"
          />
        </div>
      </div>
      @if(onVeutRecherhcher()){
      <div class="resultRecherche">
        <div class="tache-ttr text-blue-600 text-center">
          {{ TacheTrouvee() }}
          {{ TacheTrouvee() && TacheTrouvee() === 1 ? "résultat" : "résultats" }}
        </div>
      </div>
      }
    </header>
    @if(onVeutRecherhcher()){
      <app-liste-taches/>
    }
  </div>
</main>
